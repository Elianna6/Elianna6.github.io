<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="refresh" content="4;url=https://elianna.infinityfree.me/">
    
    <title>Redirection | Portfolio de Khejia</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        
        .message-container {
            margin-top: 30px;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        
        p {
            font-size: 1.1rem;
            margin: 5px 0;
        }

        .link-fallback {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .link-fallback:hover {
            background-color: #2ea043;
        }

        /* --- Animations SVG --- */
        .pulse {
            animation: pulse 1.5s infinite alternate;
        }
        
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .spin {
            transform-origin: center;
            animation: spin 4s linear infinite;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <svg width="200" height="150" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        
        <rect x="20" y="20" width="80" height="50" rx="4" stroke="#58a6ff" stroke-width="4"/>
        <path d="M30 70 L90 70 L100 85 L20 85 Z" fill="#58a6ff"/>
        <rect x="50" y="85" width="20" height="5" fill="#58a6ff"/>
        
        <text x="60" y="55" font-family="monospace" font-size="22" font-weight="bold" fill="#7ee787" text-anchor="middle" class="pulse">&lt;/&gt;</text>
        
        <g class="spin" transform="translate(100, 20) scale(0.35)">
            <circle cx="0" cy="0" r="12" stroke="#8b949e" stroke-width="4"/>
            <path d="M0 -18 L0 -6 M0 6 L0 18 M-18 0 L-6 0 M6 0 L18 0" stroke="#8b949e" stroke-width="4"/>
            <path d="M-12 -12 L-5 -5 M5 5 L12 12 M-12 12 L-5 5 M5 -5 L12 -12" stroke="#8b949e" stroke-width="4"/>
        </g>
        
    </svg>

    <div class="message-container">
        <h1>Mise à jour du Portfolio</h1>
        <p>Le portfolio de Khejia a été migré vers un serveur PHP.</p>
        <p><i>Redirection automatique en cours...</i></p>
        
        <a href="https://elianna.infinityfree.me/" class="link-fallback">Accéder au nouveau portfolio</a>
    </div>

</body>
</html>
